<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RIZAL YOUTH-PARDYYY</title>
  <link rel="stylesheet" href="index.css" />
</head>

<body>
  <h1>RIZAL YOUTH-PARDYYY</h1>

  <div class="scoreboard" id="scoreboard"></div>
  <div class="board" id="board"></div>
  <p class="hint">Click a point value to open the question. Once it's been played, that square disappears for good.</p>

  <div class="overlay" id="overlay">
    <div class="modal">
      <div class="tag" id="modalTag"></div>
      <div class="question" id="modalQuestion"></div>
      <button class="action" id="revealBtn">Reveal Answer</button>
      <div class="answer" id="modalAnswer"></div>
      <div class="award-row" id="awardRow"></div>
      <div style="margin-top:1.2rem;"><button class="close" id="closeBtn">Close &amp; remove this question</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
    
</body>

</html>
